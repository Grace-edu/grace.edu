<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grace.Edu | Sample Works</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 7%;
            text-align: center;
        }

        header h1 {
            color: #60a5fa;
        }

        .container {
            padding: 60px 7%;
            max-width: 1100px;
            margin: auto;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h2 {
            color: #111827;
            font-size: 32px;
        }

        .title p {
            color: #666;
            margin-top: 8px;
        }

        .papers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .paper {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .paper h3 {
            color: #111827;
            margin-bottom: 10px;
        }

        .paper p {
            color: #666;
            margin-bottom: 20px;
        }

        .view-button {
            display: inline-block;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .view-button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 768px) {
            .papers {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Grace.Edu</h1>
        <p>Sample Works</p>
    </header>

    <div class="container">

        <div class="title">
            <h2>Our Sample Papers</h2>
            <p>Explore some of our educational resources.</p>
        </div>

        <div class="papers">

            <div class="paper">
                <h3>Sample Question Paper 1</h3>
                <p>Mathematics — Class 10</p>

                <a href="papers/sample-paper-1.pdf"
                   target="_blank"
                   class="view-button">
                    View Paper
                </a>
            </div>

            <div class="paper">
                <h3>Sample Question Paper 2</h3>
                <p>Science — Class 10</p>

                <a href="papers/sample-paper-2.pdf"
                   target="_blank"
                   class="view-button">
                    View Paper
                </a>
            </div>

            <div class="paper">
                <h3>Sample Quiz</h3>
                <p>General Knowledge Quiz</p>

                <a href="papers/sample-quiz.pdf"
                   target="_blank"
                   class="view-button">
                    View Quiz
                </a>
            </div>

        </div>

    </div>

</body>
</html>
